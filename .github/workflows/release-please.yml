name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rebuild an existing release, for example v1.0.0"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-app:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref_name || needs.release-please.outputs.tag_name }}
      - name: Build release app
        run: >-
          xcodebuild -project DualPad.xcodeproj -scheme DualPad
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package app and set release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APP="$(pwd)/build/Build/Products/Release/DualPad.app"
          if [ ! -d "$APP" ]; then
            echo "Built app not found at $APP" >&2
            exit 1
          fi
          mkdir -p "$APP/Contents/Resources"
          cp DualPad.icns "$APP/Contents/Resources/DualPad.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile DualPad.icns" "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string DualPad.icns" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright Developer: Andre Maiqui" "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string Developer: Andre Maiqui" "$APP/Contents/Info.plist"
          xattr -cr "$APP"
          codesign --force --deep --sign - \
            --requirements '=designated => identifier "com.andremaiqui.DualPad"' "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" DualPad-macOS.zip
      - name: Attach app to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release edit "$RELEASE_TAG" --title "DualPad v$VERSION"
          gh release upload "$RELEASE_TAG" DualPad-macOS.zip --clobber
